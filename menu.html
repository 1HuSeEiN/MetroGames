<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="description" content="منيو أكل Metro Games – أشهى البرغر والوجبات وصاج الدجاج والسناكات للقيمرز. بغداد – الحرية." />
  <title>منيو أكل Metro Games | قائمة الطعام والسناكات</title>
  <meta name="theme-color" content="#080c14" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" href="logo.png" type="image/png" />
  <script src="menu-data.js"></script>

  <style>
    /* ==========================================================================
       RESET & HIGH-PERFORMANCE MOBILE FOUNDATION
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-main:       #080c14;
      --bg-surface:    #0e1522;
      --bg-card:       #121b2b;
      --bg-card-hover: #162236;
      
      --blue-primary:  #1976d2;
      --blue-accent:   #2196f3;
      --blue-glow:     #42a5f5;
      --cyan:          #00bcd4;
      --amber:         #ffb300;
      --amber-glow:    rgba(255, 179, 0, 0.25);
      
      --text-white:    #ffffff;
      --text-gray-1:   #e2e8f0;
      --text-gray-2:   #94a3b8;
      --text-muted:    #64748b;
      
      --border-subtle: rgba(66, 165, 245, 0.14);
      --border-focus:  rgba(66, 165, 245, 0.45);
      
      --radius-sm:     8px;
      --radius-md:     14px;
      --radius-lg:     22px;
      --radius-full:   9999px;
      
      --font-ar:       'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-en:       'Outfit', sans-serif;
      
      --header-h:      58px;
      --tabs-h:        52px;
      --bottom-nav-h:  calc(60px + env(safe-area-inset-bottom, 0px));
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
      background-color: var(--bg-main);
    }

    body {
      font-family: var(--font-ar);
      background: var(--bg-main);
      color: var(--text-white);
      overflow-x: hidden;
      direction: rtl;
      line-height: 1.5;
      padding-bottom: var(--bottom-nav-h);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(25, 118, 210, 0.16) 0%, transparent 65%),
        radial-gradient(circle at 100% 30%, rgba(0, 188, 212, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 0% 70%, rgba(25, 118, 210, 0.08) 0%, transparent 50%);
      background-attachment: fixed;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg-main); }
    ::-webkit-scrollbar-thumb { background: var(--blue-primary); border-radius: 99px; }

    button, a, input {
      touch-action: manipulation;
      font-family: inherit;
    }

    /* ==========================================================================
       TOP NAVBAR
       ========================================================================== */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      height: var(--header-h);
      background: rgba(8, 12, 20, 0.94);
      border-bottom: 1px solid var(--border-subtle);
      transform: translateZ(0);
      will-change: transform;
    }

    .nav-inner {
      max-width: 1200px;
      height: 100%;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .nav-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: var(--text-gray-1);
      font-size: 0.85rem;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      transition: background 0.15s, border-color 0.15s;
    }

    .nav-back:active {
      transform: scale(0.96);
      background: rgba(33, 150, 243, 0.15);
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text-white);
    }

    .nav-brand img {
      height: 38px;
      width: auto;
      object-fit: contain;
    }

    .nav-brand-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--blue-glow);
      letter-spacing: -0.3px;
    }

    /* ==========================================================================
       COMPACT MOBILE HERO SECTION
       ========================================================================== */
    .hero {
      position: relative;
      padding: 20px 16px 16px;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .hero-badge-top {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(33, 150, 243, 0.12);
      border: 1px solid rgba(66, 165, 245, 0.28);
      padding: 4px 14px;
      border-radius: var(--radius-full);
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--blue-glow);
      margin-bottom: 8px;
    }

    .hero-title {
      font-size: 1.45rem;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 4px;
    }

    .hero-title .glow-text {
      background: linear-gradient(135deg, #42a5f5, #00bcd4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-address {
      font-size: 0.8rem;
      color: var(--text-gray-2);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
    }

    .hero-address svg {
      color: var(--blue-glow);
      flex-shrink: 0;
    }

    .hero-tags {
      display: flex;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .hero-tag {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 11px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-gray-1);
    }

    /* ==========================================================================
       STICKY CATEGORY TABS
       ========================================================================== */
    .tabs-wrapper {
      position: sticky;
      top: var(--header-h);
      z-index: 90;
      background: rgba(8, 12, 20, 0.96);
      border-bottom: 1px solid var(--border-subtle);
      transform: translateZ(0);
    }

    .tabs-scroll {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x proximity;
    }

    .tabs-scroll::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      flex-shrink: 0;
      padding: 7px 16px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-full);
      color: var(--text-gray-2);
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      scroll-snap-align: start;
    }

    .tab-btn:active {
      transform: scale(0.96);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--blue-primary) 0%, #1e88e5 100%);
      color: #ffffff;
      border-color: var(--blue-glow);
      box-shadow: 0 2px 10px rgba(33, 150, 243, 0.35);
    }

    /* ==========================================================================
       MENU CONTENT & PERFORMANCE OPTIMIZED GRIDS
       ========================================================================== */
    .menu-main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 18px 12px 32px;
    }

    .category-section {
      margin-bottom: 30px;
      scroll-margin-top: calc(var(--header-h) + var(--tabs-h) + 12px);
      content-visibility: auto;
      contain-intrinsic-size: 0 450px;
    }

    .category-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 0 4px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .category-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-white);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .category-count {
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--blue-glow);
      background: rgba(33, 150, 243, 0.12);
      padding: 2px 9px;
      border-radius: var(--radius-full);
      border: 1px solid rgba(66, 165, 245, 0.2);
    }

    /* 2-Columns on Mobile, 3-4 on Tablet/Desktop */
    .items-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    @media (min-width: 768px) {
      .items-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
    }

    @media (min-width: 1024px) {
      .items-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 18px;
      }
    }

    /* ==========================================================================
       MOBILE ITEM CARD
       ========================================================================== */
    .item-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
      transition: border-color 0.2s, transform 0.15s;
      transform: translateZ(0);
      user-select: none;
    }

    .item-card:active {
      transform: scale(0.97);
      border-color: var(--blue-accent);
    }

    .card-media {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #0a0e18;
      overflow: hidden;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.25s ease;
    }

    .item-card:hover .card-img {
      transform: scale(1.05);
    }

    .card-fallback-img {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0e1522 0%, #152438 100%);
      color: rgba(66, 165, 245, 0.4);
    }

    /* Badge on top right */
    .card-badges {
      position: absolute;
      top: 6px;
      right: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 2;
      pointer-events: none;
    }

    .card-badge {
      font-size: 0.68rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: var(--radius-full);
      background: rgba(8, 12, 20, 0.94);
      border: 1px solid rgba(255, 179, 0, 0.45);
      color: #ffca28;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
      white-space: nowrap;
    }

    .card-badge.badge-spicy {
      border-color: rgba(255, 61, 0, 0.55);
      color: #ff7043;
    }

    .card-badge.badge-cold {
      border-color: rgba(0, 229, 255, 0.55);
      color: #84ffff;
    }

    /* Card Info Body */
    .card-content {
      padding: 10px 10px 12px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
      gap: 6px;
    }

    .card-title {
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--text-white);
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-desc {
      font-size: 0.72rem;
      color: var(--text-gray-2);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 2.8em;
    }

    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
      padding-top: 4px;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }

    .card-price {
      font-family: var(--font-en);
      font-size: 0.92rem;
      font-weight: 900;
      color: #ffffff;
      background: linear-gradient(135deg, rgba(255, 179, 0, 0.22) 0%, rgba(255, 111, 0, 0.4) 100%);
      border: 1px solid rgba(255, 179, 0, 0.35);
      padding: 3px 8px;
      border-radius: var(--radius-full);
      display: inline-flex;
      align-items: baseline;
      gap: 3px;
    }

    .card-price span {
      font-family: var(--font-ar);
      font-size: 0.65rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.85);
    }

    .card-view-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(33, 150, 243, 0.18);
      border: 1px solid rgba(66, 165, 245, 0.3);
      color: var(--blue-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
    }

    /* ==========================================================================
       NATIVE MOBILE BOTTOM-SHEET MODAL
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0, 0, 0, 0.78);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-sheet {
      width: 100%;
      max-width: 500px;
      max-height: 86vh;
      background: #0d1420;
      border-radius: 20px 20px 0 0;
      border: 1px solid rgba(66, 165, 245, 0.25);
      border-bottom: none;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.8);
    }

    .modal-backdrop.open .modal-sheet {
      transform: translateY(0);
    }

    @media (min-width: 600px) {
      .modal-backdrop {
        align-items: center;
        padding: 20px;
      }
      .modal-sheet {
        border-radius: var(--radius-lg);
        border-bottom: 1px solid rgba(66, 165, 245, 0.25);
        max-height: 85vh;
        transform: scale(0.94);
      }
      .modal-backdrop.open .modal-sheet {
        transform: scale(1);
      }
    }

    .sheet-handle-bar {
      width: 44px;
      height: 4px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.3);
      margin: 10px auto 4px;
    }

    .sheet-image-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #06090e;
      overflow: hidden;
    }

    .sheet-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .sheet-img-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, #0d1420 0%, transparent 60%);
    }

    .sheet-close-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
    }

    .sheet-body {
      padding: 16px 20px 24px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sheet-header-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .sheet-title {
      font-size: 1.25rem;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.3;
    }

    .sheet-price {
      font-family: var(--font-en);
      font-size: 1.45rem;
      font-weight: 900;
      color: #ffb300;
      display: flex;
      align-items: baseline;
      gap: 4px;
      white-space: nowrap;
    }

    .sheet-price small {
      font-family: var(--font-ar);
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-gray-2);
    }

    .sheet-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .sheet-badge {
      font-size: 0.78rem;
      font-weight: 800;
      padding: 4px 11px;
      border-radius: var(--radius-full);
      background: rgba(255, 179, 0, 0.12);
      border: 1px solid rgba(255, 179, 0, 0.4);
      color: #ffca28;
    }

    .sheet-badge.badge-spicy {
      background: rgba(255, 61, 0, 0.15);
      border-color: #ff5722;
      color: #ff8a80;
    }

    .sheet-badge.badge-cold {
      background: rgba(0, 188, 212, 0.15);
      border-color: #00e5ff;
      color: #84ffff;
    }

    .sheet-desc {
      font-size: 0.85rem;
      color: var(--text-gray-1);
      line-height: 1.6;
    }

    .sheet-actions {
      margin-top: 10px;
      display: flex;
      gap: 10px;
    }

    .sheet-dismiss-btn {
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      color: var(--text-white);
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
    }

    /* ==========================================================================
       MOBILE BOTTOM NAVIGATION BAR
       ========================================================================== */
    .mobile-bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--bottom-nav-h);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: rgba(8, 12, 20, 0.96);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 100;
      transform: translateZ(0);
    }

    .bottom-tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      text-decoration: none;
      color: var(--text-gray-2);
      font-size: 0.74rem;
      font-weight: 700;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 8px 0;
      transition: color 0.15s;
    }

    .bottom-tab:active {
      transform: scale(0.92);
      color: var(--blue-glow);
    }

    .bottom-icon {
      width: 22px;
      height: 22px;
    }

    /* Footer */
    .menu-footer {
      text-align: center;
      padding: 30px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.78rem;
      color: var(--text-muted);
    }
    .menu-footer img {
      height: 32px;
      margin-bottom: 8px;
      opacity: 0.8;
    }

    /* Smallest screens (< 340px) */
    @media (max-width: 330px) {
      .items-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-brand">
        <img src="logo.png" alt="Metro Games" />
        <span class="nav-brand-title">منيو Metro</span>
      </a>

      <a href="index.html" class="nav-back">
        <span>الموقع الرئيسي</span>
        <span>←</span>
      </a>
    </div>
  </header>

  <!-- ================= COMPACT MOBILE HERO ================= -->
  <section class="hero">
    <div class="hero-badge-top">صالة Metro Games</div>
    <h1 class="hero-title">أشهى المأكولات & <span class="glow-text">السناكات</span></h1>
    <div class="hero-address" id="restaurantAddress">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <span>بغداد – الحرية – شارع المشجر</span>
    </div>
    <div class="hero-tags">
      <span class="hero-tag">برغر فاخر</span>
      <span class="hero-tag">صاج وساندويتش</span>
      <span class="hero-tag">سناكات ومقبلات</span>
      <span class="hero-tag">وجبات كومبو</span>
      <span class="hero-tag">مشروبات باردة</span>
    </div>
  </section>

  <!-- ================= STICKY CATEGORY TABS ================= -->
  <nav class="tabs-wrapper" id="tabsWrapper">
    <div class="tabs-scroll" id="tabsContainer">
      <!-- Dynamic Category Tabs Injected Here -->
    </div>
  </nav>

  <!-- ================= MAIN MENU CONTENT ================= -->
  <main class="menu-main">
    <div id="menuSections"></div>
  </main>

  <!-- ================= NATIVE MOBILE BOTTOM SHEET MODAL ================= -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-sheet" id="modalSheet">
      <div class="sheet-handle-bar"></div>
      
      <div class="sheet-image-wrap">
        <button type="button" class="sheet-close-btn" id="modalCloseBtn" aria-label="إغلاق">✕</button>
        <div id="modalImageContainer"></div>
        <div class="sheet-img-gradient"></div>
      </div>

      <div class="sheet-body">
        <div class="sheet-header-row">
          <h2 class="sheet-title" id="modalTitle"></h2>
          <div class="sheet-price" id="modalPrice"></div>
        </div>

        <div class="sheet-badges" id="modalBadges"></div>
        <p class="sheet-desc" id="modalDesc"></p>

        <div class="sheet-actions">
          <button type="button" class="sheet-dismiss-btn" id="modalDismissBtn">إغلاق</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= FOOTER ================= -->
  <footer class="menu-footer">
    <img src="logo.png" alt="Metro Games" />
    <p>Metro Games – بغداد – الحرية – شارع المشجر</p>
    <p style="margin-top: 10px; color:#475569;">© 2025 E-Metro Games – مو بس لعب… أسلوب حياة</p>
  </footer>

  <!-- ================= MOBILE BOTTOM NAVIGATION ================= -->
  <nav class="mobile-bottom-nav">
    <a href="index.html" class="bottom-tab">
      <svg class="bottom-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span>الرئيسية</span>
    </a>

    <button type="button" class="bottom-tab" id="btnBottomCats" onclick="goToCategories();">
      <svg class="bottom-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
        <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
      </svg>
      <span>الأقسام</span>
    </button>

    <button type="button" class="bottom-tab" onclick="window.scrollTo({top:0, behavior:'smooth'});">
      <svg class="bottom-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="18 15 12 9 6 15"/>
      </svg>
      <span>للأعلى</span>
    </button>
  </nav>

  <!-- ================= ZERO-LAG MOBILE JAVASCRIPT ================= -->
  <script>
  (function() {
    'use strict';

    // State
    let categories = [];

    // Elements
    const tabsContainer = document.getElementById('tabsContainer');
    const menuSections = document.getElementById('menuSections');
    
    // Modal Elements
    const modalBackdrop = document.getElementById('modalBackdrop');
    const modalImageContainer = document.getElementById('modalImageContainer');
    const modalTitle = document.getElementById('modalTitle');
    const modalPrice = document.getElementById('modalPrice');
    const modalBadges = document.getElementById('modalBadges');
    const modalDesc = document.getElementById('modalDesc');
    const modalCloseBtn = document.getElementById('modalCloseBtn');
    const modalDismissBtn = document.getElementById('modalDismissBtn');

    // Number formatter for Iraqi Dinar
    function formatIQD(num) {
      return Number(num).toLocaleString('en-US');
    }

    // Badge Extractor (Clean Text, No Emoji Clutter)
    function extractBadges(item) {
      const list = [];
      if (item.type) {
        const t = String(item.type).trim();
        if (t === 'حار' || t === 'ساخن') list.push({ text: 'حار', cls: 'badge-spicy' });
        else if (t === 'بارد' || t === 'مثلج') list.push({ text: 'بارد', cls: 'badge-cold' });
      }

      const raw = item.badges || item.badge || item.tags;
      if (raw) {
        const arr = Array.isArray(raw) ? raw : String(raw).split(/[,،\n]+/);
        arr.forEach(b => {
          if (!b) return;
          // Strip emoji characters from badge text if any remain
          const str = String(b).replace(/[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu, '').trim();
          if (!str) return;
          let cls = '';
          const lower = str.toLowerCase();
          if (lower.includes('حار') || lower.includes('سبايسي') || lower.includes('نار')) cls = 'badge-spicy';
          else if (lower.includes('بارد') || lower.includes('ثلج')) cls = 'badge-cold';
          list.push({ text: str, cls });
        });
      }

      // Deduplicate
      const seen = new Set();
      return list.filter(b => {
        if (seen.has(b.text)) return false;
        seen.add(b.text);
        return true;
      });
    }

    // Render Tabs
    function renderTabs() {
      tabsContainer.innerHTML = '';

      // All Tab
      const allBtn = document.createElement('button');
      allBtn.type = 'button';
      allBtn.className = 'tab-btn active';
      allBtn.textContent = 'الكل';
      allBtn.dataset.catId = 'all';
      allBtn.onclick = () => selectCategory('all');
      tabsContainer.appendChild(allBtn);

      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'tab-btn';
        // Clean emoji from category name if any
        btn.textContent = (cat.name || '').replace(/[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu, '').trim();
        btn.dataset.catId = cat.id;
        btn.onclick = () => selectCategory(cat.id);
        tabsContainer.appendChild(btn);
      });
    }

    // Render All Sections & Cards
    function renderMenu() {
      menuSections.innerHTML = '';
      const frag = document.createDocumentFragment();

      const fallbackSvg = `
        <div class="card-fallback-img">
          <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M18 2v20M2 2v6a4 4 0 0 0 4 4h0a4 4 0 0 0 4-4V2M6 12v10"/>
          </svg>
        </div>
      `;

      categories.forEach(cat => {
        const items = cat.items || [];
        if (items.length === 0) return;

        const section = document.createElement('section');
        section.className = 'category-section';
        section.id = 'sec-' + cat.id;
        section.dataset.catId = cat.id;

        const cleanCatName = (cat.name || '').replace(/[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu, '').trim();

        const header = document.createElement('div');
        header.className = 'category-header';
        header.innerHTML = `
          <h2 class="category-title">${cleanCatName}</h2>
          <span class="category-count">${items.length} وجبة</span>
        `;
        section.appendChild(header);

        const grid = document.createElement('div');
        grid.className = 'items-grid';

        items.forEach(item => {
          const card = document.createElement('article');
          card.className = 'item-card';

          const badges = extractBadges(item);
          const topBadge = badges.length > 0 ? badges[0] : null;
          const imgSrc = item.image || item.image_url || '';

          card.innerHTML = `
            <div class="card-media">
              ${topBadge ? `<div class="card-badges"><span class="card-badge ${topBadge.cls}">${topBadge.text}</span></div>` : ''}
              ${imgSrc 
                ? `<img class="card-img" src="${imgSrc}" alt="${item.name}" loading="lazy" decoding="async" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
                   ${fallbackSvg}`
                : fallbackSvg
              }
            </div>
            <div class="card-content">
              <h3 class="card-title">${item.name}</h3>
              <p class="card-desc">${item.description || 'وجبة طازجة وشهية محضرة خصيصاً في Metro Games.'}</p>
              <div class="card-bottom">
                <div class="card-price">${formatIQD(item.price)} <span>د.ع</span></div>
                <div class="card-view-btn">‹</div>
              </div>
            </div>
          `;

          card.onclick = () => openItemModal(item, cleanCatName);
          grid.appendChild(card);
        });

        section.appendChild(grid);
        frag.appendChild(section);
      });

      menuSections.appendChild(frag);
    }

    // Select Category Tab
    window.selectCategory = function(catId) {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.catId === catId);
      });

      const activeBtn = document.querySelector(`.tab-btn[data-cat-id="${catId}"]`);
      if (activeBtn) {
        activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }

      if (catId === 'all') {
        const tabsEl = document.getElementById('tabsWrapper');
        if (tabsEl) {
          const top = tabsEl.getBoundingClientRect().top + window.pageYOffset - 58;
          window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
        }
      } else {
        const sec = document.getElementById('sec-' + catId);
        if (sec) {
          const headerOffset = 112;
          const top = sec.getBoundingClientRect().top + window.pageYOffset - headerOffset;
          window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
        }
      }
    };

    // ScrollSpy to highlight active tab as user scrolls
    let scrollTimer;
    window.addEventListener('scroll', function() {
      if (scrollTimer) return;
      scrollTimer = setTimeout(() => {
        scrollTimer = null;
        
        const sections = document.querySelectorAll('.category-section');
        const scrollPos = window.pageYOffset + 140;

        let currentCat = 'all';
        sections.forEach(sec => {
          if (sec.offsetTop <= scrollPos && (sec.offsetTop + sec.offsetHeight) > scrollPos) {
            currentCat = sec.dataset.catId;
          }
        });

        document.querySelectorAll('.tab-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.catId === currentCat);
        });

        const activeBtn = document.querySelector(`.tab-btn[data-cat-id="${currentCat}"]`);
        if (activeBtn) {
          activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }
      }, 100);
    }, { passive: true });

    // Modal Sheet Functions
    function openItemModal(item, catName) {
      const imgSrc = item.image || item.image_url || '';
      modalImageContainer.innerHTML = imgSrc
        ? `<img class="sheet-img" src="${imgSrc}" alt="${item.name}" />`
        : `<div class="card-fallback-img" style="aspect-ratio:16/9;">
             <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
               <path d="M18 2v20M2 2v6a4 4 0 0 0 4 4h0a4 4 0 0 0 4-4V2M6 12v10"/>
             </svg>
           </div>`;

      modalTitle.textContent = item.name;
      modalPrice.innerHTML = `${formatIQD(item.price)} <small>د.ع</small>`;
      modalDesc.textContent = item.description || catName;

      const badges = extractBadges(item);
      if (badges.length > 0) {
        modalBadges.innerHTML = badges.map(b => `<span class="sheet-badge ${b.cls}">${b.text}</span>`).join('');
        modalBadges.style.display = 'flex';
      } else {
        modalBadges.innerHTML = '';
        modalBadges.style.display = 'none';
      }

      modalBackdrop.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      modalBackdrop.classList.remove('open');
      document.body.style.overflow = '';
    }

    if (modalCloseBtn) modalCloseBtn.onclick = closeModal;
    if (modalDismissBtn) modalDismissBtn.onclick = closeModal;
    if (modalBackdrop) {
      modalBackdrop.onclick = (e) => {
        if (e.target === modalBackdrop) closeModal();
      };
    }
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    // Bottom Bar Button Handler
    window.goToCategories = function() {
      const tabsEl = document.getElementById('tabsWrapper');
      if (tabsEl) {
        const top = tabsEl.getBoundingClientRect().top + window.pageYOffset - 58;
        window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
      }
    };

    // Load Data & Init
    async function init() {
      let data = (typeof window.MENU_DATA !== 'undefined' && window.MENU_DATA) ? window.MENU_DATA : null;

      try {
        const res = await fetch('menu.json?v=' + Date.now());
        if (res.ok) {
          const json = await res.json();
          if (json && json.categories && json.categories.length > 0) {
            data = json;
          }
        }
      } catch (err) {
        console.warn('Using local MENU_DATA');
      }

      if (data && data.restaurant && data.restaurant.address) {
        const addrEl = document.getElementById('restaurantAddress');
        if (addrEl && addrEl.lastElementChild) {
          addrEl.lastElementChild.textContent = data.restaurant.address;
        }
      }

      if (data && data.categories) {
        categories = data.categories.filter(c => c.items && c.items.length > 0);
      }

      renderTabs();
      renderMenu();
    }

    init();
  })();
  </script>
</body>
</html>
